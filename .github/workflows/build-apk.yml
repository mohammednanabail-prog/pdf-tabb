name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install expo-image-picker expo-print expo-sharing expo-linear-gradient expo-document-picker -- --legacy-peer-deps
          npm install react-native-draggable-flatlist react-native-gesture-handler react-native-reanimated jszip --legacy-peer-deps --no-audit --no-fund

      - name: Ensure babel config
        run: |
          if [ ! -f "babel.config.js" ]; then
            cat > babel.config.js << 'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
              plugins: ['react-native-reanimated/plugin'],
            };
          };
          EOF
          fi

      - name: Run expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Create debug keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: 'APK Build #${{ github.run_number }}'
          files: '**/build/outputs/apk/**/*.apk'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
